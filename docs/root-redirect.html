<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pumice Docs</title>
<!-- No-JS fallback: only takes effect when scripting is disabled, so it
     never races with the script below. -->
<noscript><meta http-equiv="refresh" content="0; url=en/index.html"></noscript>
<script>
  (function () {
    var lang = (navigator.language || navigator.userLanguage || "en").toLowerCase();
    var target = lang.indexOf("ko") === 0 ? "ko/index.html" : "en/index.html";
    window.location.replace(target);
  })();
</script>
</head>
<body>
<p>
  Redirecting to the docs&hellip; If you are not redirected automatically,
  choose a language:
  <a href="en/index.html">English</a> / <a href="ko/index.html">한국어</a>
</p>
</body>
</html>
